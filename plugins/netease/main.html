		return;
	}
	const want = (on === undefined) ? !lyricsMode() : !!on;
	$('now').classList.toggle('lyrics-mode', want);
	if (want) { lyIndex = -1; loadLyrics(curId); paintLyrics(true); }
}

async function loadLyrics(id) {
	const box = $('lyr-inner');
	if (!id) { box.innerHTML = '<div class="lyr-empty">这首歌没有歌词</div>'; return; }
	if (lyricId === id && lyricLines) return;
	lyricId = id;
	lyricLines = null;
	lyIndex = -1;
	box.innerHTML = '<div class="lyr-empty">歌词加载中…</div>';
	try {
		const d = await e5.api('/lyric?id=' + id);
		if (lyricId !== id) return;                 // 期间又换歌了
		if (!d || !d.ok || !d.lines || !d.lines.length) {
			box.innerHTML = '<div class="lyr-empty">这首歌没有歌词</div>';
			return;
		}
		lyricLines = d.lines;
		box.innerHTML = '';
		lyricLines.forEach((l) => {
			const el = document.createElement('div');
			el.className = 'lyr-line';
			const a = document.createElement('span');
			a.className = 's';
			if (l.w && l.w.length) {
				// 逐字歌词：每个字一个 span，播放时按时间逐个点亮
				el.classList.add('kala');
				l.w.forEach((w) => {
					const c = document.createElement('span');
					c.className = 'wc';
					c.textContent = w.s;
					a.appendChild(c);
				});
				el._wt = l.w.map((x) => x.t);
			} else {
				a.textContent = l.s;
			}
			el.appendChild(a);
			if (l.tr) {                              // 非中文歌的中文翻译
				const b = document.createElement('span');
				b.className = 'tr';
				b.textContent = l.tr;
				el.appendChild(b);
			}
			box.appendChild(el);
		});
		lyIndex = -1;
		paintLyrics(true);
	} catch (e) {
		box.innerHTML = '<div class="lyr-empty">歌词加载失败</div>';
	}
}

// 换歌了：歌词跟着换
function refreshLyrics() {
	if (!lyricsMode()) return;
	lyricLines = null;
	lyricId = 0;
	loadLyrics(curId);
}

function scrollLyricTo(el) {
	const box = $('lyr');
	const target = Math.max(0, el.offsetTop - box.clientHeight / 2 + el.offsetHeight / 2);
	const from = box.scrollTop;
	if (Math.abs(target - from) < 2) return;
	const t0 = Date.now(), dur = 260;
	const run = () => {
		const k = Math.min(1, (Date.now() - t0) / dur);
		box.scrollTop = from + (target - from) * (1 - Math.pow(1 - k, 3));
		if (k < 1) requestAnimationFrame(run);
	};
	requestAnimationFrame(run);
}

function paintLyrics(force) {
	if (!lyricLines || $('now').hidden || !lyricsMode()) return;
	let k = 0;
	for (let i = 0; i < lyricLines.length; i++) {
		if (lyricLines[i].t <= posMs + 120) k = i; else break;
	}
	// 间奏：这一句和下一句隔得远，说明中间是纯音乐。
	// 这时候把最后 1.5 秒的高亮取消掉，不然一句歌词会挂十几秒，
	// 看起来像"卡住了"。最后一句没有下一句，按唱完 4.5 秒算。
	if (k >= 0 && k < lyricLines.length) {
		const cur = lyricLines[k];
		const nxt = lyricLines[k + 1];
		if (nxt) {
			const gap = nxt.t - cur.t;
			if (gap > 6000 && posMs > nxt.t - 1500) k = -1;
		} else if (posMs > cur.t + 4500) {
			k = -1;
		}
	}
	if (k === lyIndex && !force) return;
	const kids = $('lyr-inner').children;
	const prev = lyIndex;
	lyIndex = k;
	// 全部清掉，不只 prev：手动滚动、歌词跳变、force 重绘都可能留下
	// 不止一个 .on，表现就是"两句同时高亮"。
	for (let i = 0; i < kids.length; i++) kids[i].classList.remove('on');
	if (!kids[k]) return;
	kids[k].classList.add('on');
	// 逐字行：把已经唱到的字点亮
	const cur = kids[k];
	if (cur._wt && cur._wt.length) {
		const wc = cur.querySelectorAll('.wc');
		const wt = cur._wt;
		let n = 0;
		while (n < wt.length && wt[n] <= posMs) n++;
		for (let i = 0; i < wc.length; i++) wc[i].classList.toggle('done', i < n);
	}
	// 用户刚手动滚过就先别抢，3.5 秒后恢复自动跟
	if (k !== prev && Date.now() - userScrollAt > 3500) scrollLyricTo(kids[k]);
}

// 点封面或歌名进歌词页
document.querySelector('#now .art').onclick = () => toggleLyrics(true);
document.querySelector('#now .meta').onclick = () => toggleLyrics(true);

// 歌词页里：拖动=翻看（暂停自动滚），轻点=回封面。
// 一律用 click 判断"轻点"，不要用 touchend —— touchend 里把歌词收起来之后，
// WebKit 还会补发一个 click，那时封面已经显示出来了，正好落在 .art 上又被切回歌词，
// 表现就是"点了没反应"。
$('lyr').addEventListener('touchstart', (e) => {
	const t = e.touches[0];
	if (!t) return;
	lyrTouchX = t.clientX;
	lyrTouchY = t.clientY;
	userScrollAt = Date.now();
}, { passive: true });
$('lyr').addEventListener('touchmove', (e) => {
	const t = e.touches[0];
	if (!t) return;
	if (Math.abs(t.clientY - lyrTouchY) > 10 || Math.abs(t.clientX - lyrTouchX) > 10)
		lyrMovedAt = Date.now();          // 超过 10px 才算滚动，手指抖动不算
	userScrollAt = Date.now();
}, { passive: true });
$('lyr').addEventListener('touchend', () => { userScrollAt = Date.now(); });
$('lyr').onclick = () => {
	if (Date.now() - lyrMovedAt > 500) toggleLyrics(false);   // 刚滚过就不当成轻点
};

/* ---------- 专辑取色 ---------- */

// 把封面缩到 16×16 画到 canvas 上，按色桶统计出现最多的三个颜色。
// 图片是同源缓存（/plugins/netease/cache/*），不会有 canvas 污染问题。
let palSource = '', palRaw = null;

function colorDist(a, b) {
	const dr = a.r - b.r, dg = a.g - b.g, db = a.b - b.b;
	return Math.sqrt(dr * dr + dg * dg + db * db);
}

function extractPalette(src, cb) {
	const img = new Image();
	img.onload = () => {
		try {
			const n = 16;
			const cv = document.createElement('canvas');
			cv.width = n; cv.height = n;
			const g = cv.getContext('2d');
			g.drawImage(img, 0, 0, n, n);
			const d = g.getImageData(0, 0, n, n).data;
			const buckets = new Map();
			for (let i = 0; i < d.length; i += 4) {
				if (d[i + 3] < 200) continue;
				const r = d[i], gg = d[i + 1], b = d[i + 2];
				const key = ((r >> 4) << 8) | ((gg >> 4) << 4) | (b >> 4);
				const cur = buckets.get(key) || { n: 0, r: 0, g: 0, b: 0 };
				cur.n++; cur.r += r; cur.g += gg; cur.b += b;
				buckets.set(key, cur);
			}
			const list = Array.from(buckets.values()).sort((x, y) => y.n - x.n);
			const out = [];
			for (const c0 of list) {
				const col = { r: c0.r / c0.n, g: c0.g / c0.n, b: c0.b / c0.n };
				const lum = (col.r * 0.299 + col.g * 0.587 + col.b * 0.114) / 255;
				if (lum < 0.06 || lum > 0.96) continue;          // 纯黑纯白没意义
				if (out.some((x) => colorDist(x, col) < 42)) continue;  // 太接近的不要
				out.push(col);
				if (out.length >= 3) break;
			}
			cb(out);
		} catch (e) { cb(null); }
	};
	img.onerror = () => cb(null);
	img.src = src;
}

// 深色把颜色压暗、浅色把它提亮白，保证上面的文字始终读得清
function applyPalette(cols) {
	const el = $('now-bg');
	if (!el) return;
	const light = document.body.dataset.theme === 'light';
	const def = light ? ['#dfe9f4', '#e9f0f8', '#e4eef7'] : ['#141b26', '#111822', '#0e141d'];
	const conv = (c) => {
		let r = c.r, g = c.g, b = c.b;
		if (light) { r = r + (255 - r) * .82; g = g + (255 - g) * .82; b = b + (255 - b) * .82; }
		else { r *= .40; g *= .40; b *= .40; }
		return 'rgb(' + Math.round(r) + ',' + Math.round(g) + ',' + Math.round(b) + ')';
	};
	const got = (cols || []).map(conv);
	for (let i = 0; i < 3; i++) el.style.setProperty('--c' + (i + 1), got[i] || def[i]);
}

function updatePalette(src) {
	if (!src) { palSource = ''; palRaw = null; applyPalette(null); return; }
	if (src === palSource) return;
	palSource = src;
	palRaw = null;
	extractPalette(src, (cols) => {
		if (palSource !== src) return;    // 期间又换歌了
		palRaw = cols;
		applyPalette(cols);
	});
}

/* ---------- 拖进度条 ---------- */

// 进程播放没有 seek，只能让后端停掉重开、用 -k 跳帧，所以松手才发请求，
// 拖动过程中只改界面。
const trackEl = $('now-track');
let dragging = false, dragRatio = 0;


function ratioAt(e) {
	const r = trackEl.getBoundingClientRect();
	const p = (e.touches && e.touches[0]) ? e.touches[0] : e;
	if (!r.width) return 0;
	let ratio = Math.max(0, Math.min(1, (p.clientX - r.left) / r.width));
	// 试听片段：拖不过上限。钳在这里而不是只拦 endDrag，
	// 这样拖动的时候滑块就停在边界上，手感是"拖不动"而不是"松手被打回"。
	if (trialLimitSec > 0 && curDuration > 0) {
		const maxRatio = (trialLimitSec * 1000) / curDuration;
		if (ratio > maxRatio) ratio = maxRatio;
	}
	return ratio;
}

// 把白点摆到"试听到此为止"的位置。比例按整首歌的长度算，
// 所以点在进度条上偏左，跟实际听感一致（只能听开头一小截）。
function paintTrialDot() {
	const dot = $('trial-dot');
	if (!dot) return;
	// 用 style.display 而不是 hidden 属性：这个页面的 CSS 里没有通用的
	// [hidden] { display: none }，只给几个具体元素单独写了规则，
	// 所以 hidden 在这颗白点上不生效 —— 表现就是"切到普通歌它还亮着"。
	if (trialLimitSec <= 0 || !curDuration) {
		dot.style.display = 'none';
		return;
	}
	const r = Math.min(1, (trialLimitSec * 1000) / curDuration);
	dot.style.display = 'block';
	dot.style.left = (r * 100) + '%';
}

function paintDrag() {
	$('now-bar').style.width = (dragRatio * 100) + '%';
	$('now-cur').textContent = fmt(dragRatio * curDuration);
}

function beginDrag(e) {
	if (!curDuration) return;
	dragging = true;
	dragRatio = ratioAt(e);
	paintDrag();
	if (e.cancelable) e.preventDefault();
}

function moveDrag(e) {
	if (!dragging) return;
	dragRatio = ratioAt(e);
	paintDrag();
	if (e.cancelable) e.preventDefault();
}

async function endDrag() {
	if (!dragging) return;
	dragging = false;
	const sec = Math.round((dragRatio * curDuration) / 1000);
	try {
		const d = await e5.api('/seek?pos=' + sec);
		if (!d || !d.ok) throw new Error((d && d.error) || '定位失败');
		// 拖的时候是暂停状态，重开的进程是播放着的，得再停一下
		if (paused) await e5.api('/pause');
		posMs = sec * 1000;
		lastTick = Date.now();
		renderProgress();
	} catch (err) {
		setErr('拖动失败：' + (err && err.message ? err.message : err));
		syncNow();
	}
}

trackEl.addEventListener('touchstart', beginDrag, { passive: false });
trackEl.addEventListener('touchmove', moveDrag, { passive: false });
trackEl.addEventListener('touchend', endDrag);
trackEl.addEventListener('touchcancel', endDrag);
trackEl.addEventListener('mousedown', beginDrag);
window.addEventListener('mousemove', (e) => { if (dragging) moveDrag(e); });
window.addEventListener('mouseup', () => { if (dragging) endDrag(); });

/* ---------- 喜欢 / 不喜欢 / 歌手页 ---------- */

// 当前这首的歌手（从 /status 的 artists 拿，形如 [{id,name}, ...]）
let curArtists = [];
let likedState = 0, likedFor = 0;
let curPid = 0;            // 播客节目 id（>0 表示当前放的是播客）

const ICON_HEART = '<svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/></svg>';


function paintLike() {
	const b = $('now-like');
	if (!b) return;
	// 播客（节目）：没有"喜欢"和"不想听"，换成"点赞"（对应 App 的点赞单集）
	const isProg = curPid > 0;
	b.hidden = isProg;
	const d = $('now-dislike');
	// "不想听"= 不喜欢，只在私人FM 有意义
	if (d) d.hidden = isProg || !(listSrc && listSrc.kind === 'fm');
	const dj = $('now-djlike');
	if (dj) {
		dj.hidden = !isProg;
		if (isProg) {
			const on = djLiked(curPid);
			dj.classList.toggle('on', !!on);   // .ico.on 会染成主题色并填充图标
			dj.setAttribute('aria-label', on ? '取消点赞' : '点赞');
		}
	}
	if (b.dataset.kind !== 'heart') { b.innerHTML = ICON_HEART; b.dataset.kind = 'heart'; }
	b.classList.toggle('on', !!likedState);
	b.setAttribute('aria-label', likedState ? '取消喜欢' : '喜欢');
}

async function refreshLike() {
	if (!curId || curPid > 0) return;      // 播客不查喜欢
	if (likedFor === curId) return;
	likedFor = curId;
	try {
		const d = await e5.api('/like?id=' + curId);
		likedState = (d && d.ok) ? d.liked : 0;
	} catch (e) { likedState = 0; }
	paintLike();
}

async function toggleLike() {
	if (!curId || curPid > 0) return;
	const want = likedState ? 0 : 1;
	try {
		const d = await e5.api('/like?id=' + curId + '&set=' + want);
		if (!d || !d.ok) throw new Error((d && d.error) || '操作失败');
		likedState = d.liked;
		paintLike();
	} catch (e) { setErr((e && e.message ? e.message : '操作失败')); }
}

// "不想听"：只是这次从当前列表里去掉并跳下一首，不写任何黑名单，
// 下次进同一个列表它还在。想永久屏蔽才需要黑名单，那是另一回事。
function dropCurrent() {
	if (!songs.length) return;
	// 电台：交给 dropSong，它会让后端换歌，本地不做增删
	if (listSrc && listSrc.kind === 'fm') {
		const cur = songs[index];
		if (cur) dropSong(cur);
		return;
	}
	// index 可能因为后端续播/恢复而失配，先按 id 找一次
	let at = index;
	if (at < 0 || !songs[at] || String(songs[at].id) !== String(curId))
		at = songs.findIndex((x) => String(x.id) === String(curId));
	if (at < 0) { setErr('这首不在当前列表里'); return; }
	index = at;
	const gone = songs[at] ? songs[at].name : '';
	const goneId = songs[at] ? String(songs[at].id) : '';
	songs.splice(index, 1);
	if (index >= songs.length) index = songs.length - 1;
	// 正在浏览的列表里也有这首的话一起拿掉
	const vi = viewSongs.findIndex((x) => String(x.id) === goneId);
	if (vi >= 0) viewSongs.splice(vi, 1);
	renderSongs();
	saveQueue(curTab, listHint);
	setErr('这次先不听' + (gone ? '：' + gone : ''));
	setTimeout(() => setErr(''), 2600);
	if (songs.length) playAt(index);
	else { playing = false; paused = false; setToggleIcon(false); }
}

// 不喜欢：把这首从当前列表和播放队列里拿掉。正在放就接着放下一首。
// 后端没有"反馈给推荐"的接口，所以只做本地的"这次先不听"。
function dropSong(s) {
	const id = String(s.id);
	// "不喜欢"只属于私人FM（垃圾桶接口 alg=RT 也只影响推荐流），
	// 所以这个函数现在只会在电台下被调用。
	const inFm = !!(listSrc && listSrc.kind === 'fm');
	if (inFm) {
		e5.api('/fm/skip?id=' + id).then((d) => {
			if (d && d.cloud) setHint('已不喜欢 · 之后不会再推荐');
			// 踩的正是正在放的这首：让后端换一首（本地队列不删 ——
			// 电台的队列由后端池子决定，本地删了会和实际播放对不上）
			if (String(curId) === id) step(1);
		}).catch(() => {});
		return;
	}
	const vi = viewSongs.findIndex((x) => String(x.id) === id);
	if (vi >= 0) { viewSongs.splice(vi, 1); renderSongs(); }
	const qi = songs.findIndex((x) => String(x.id) === id);
	if (qi >= 0) {
		const wasCurrent = String(curId) === id;
		songs.splice(qi, 1);
		if (qi < index) index--;
		if (wasCurrent) {
			if (index >= songs.length) index = songs.length - 1;
			if (songs.length) playAt(index);
			else { playing = false; paused = false; setToggleIcon(false); }
		}
		saveQueue(curTab, listHint);
		if (!$('queue').hidden) renderQueue();
	}
	setHint('已不喜欢：' + (s.name || ''));
}

// 歌手选择列表：沉浸页点歌手名、长按菜单的"歌手"都走这里。
// 多个歌手时让人自己选，别把 "A / B" 整串当成一个人的名字。
function renderArtistPick(list) {
	const l = $('plist');
	l.innerHTML = '';
	list.forEach((a, i) => {
		const row = document.createElement('div');
		row.className = 'qrow';
		row.innerHTML = '<div class="qi"></div><div class="qn2"><div class="q1"></div></div>';
		row.querySelector('.qi').textContent = i + 1;
		row.querySelector('.q1').textContent = a.name;
		row.onclick = () => { closePick(); closeNow(); openArtistPage(a); };
		l.appendChild(row);
	});
	showAnim($('pick'));
}

function openPick() {
	if (!curArtists.length) { setErr('还不知道歌手是谁，等这一轮状态同步完再点'); return; }
	// 进歌手页前先收起沉浸页，否则它会一直盖在歌手页上面
	if (curArtists.length === 1) { closeNow(); openArtistPage(curArtists[0]); return; }
	renderArtistPick(curArtists);
}
function closePick() { hideAnim($('pick'), 'closing', 140); }

// 歌手页其实就是把主列表换成这个歌手的热门 50 首（顺序固定，后端续播也对得上）
/* ---------- 独立歌手页 ---------- */
let aPageId = 0, aPageName = '';
// 歌手页单独用一个序号。以前跟 loadTab/openArtist 共用全局 viewSeq，那边一动
// 这边刚发出去的请求就被判成"过期"丢掉 —— 排序切换看起来完全没反应。
let aPageSeq = 0;

async function openArtistPage(a) {
	if (!a || !a.id) return;
	aPageId = a.id;
	aPageName = a.name || '';
	// 先占位但保持透明，等数据到了再淡入，避免"空名字先亮一下再被替换"
	$('a-name').textContent = aPageName;
	$('a-name').style.opacity = '0';
	$('a-meta').textContent = '加载中…';
	$('a-meta').style.opacity = '0';
	$('a-bg').style.opacity = '0';
	// 只清行容器，别清 a-list —— 上下的占位块（a-top/a-bot）和"到底了"都在里面，
	// 整块清掉的话 getElementById('a-rows') 后面就是 null，列表一片空白。
	aRowH = 0;
	aWinFrom = aWinTo = -1;
	const rowsBox = $('a-rows');
	if (rowsBox) rowsBox.innerHTML = '';
	$('a-bg').style.backgroundImage = '';
	$('a-follow').classList.remove('on');
	// 每次进歌手页都回到"歌曲"，专辑列表也清掉（换歌手了不能留上一个的）
	aTab = 'songs';
	albumList = [];
	albumMore = 0;
	albumTotal = 0;
	paintArtistTabs();
	showAnim($('apage'));
	$('apage').scrollTop = 0;
	await loadArtistPage();
}

async function loadArtistPage() {
	const seq = ++aPageSeq;
	setHint('加载中…');
	const load = $('a-load');
	if (load) load.style.display = 'flex';
	try {
		// 跟网易云一致：热度只给 50 首（够看代表作），时间排序才翻全部。
		// 热度页不再往下加载 —— 五十首就是五十首，滚到底也不该冒出更多。
		const lim = artistOrder === 'time' ? 100 : 50;
		const d = await e5.api('/artist?id=' + aPageId + '&offset=0&limit=' + lim + '&order=' + artistOrder);
		if (seq !== aPageSeq) { console.log('[netease] artist stale, seq=' + seq + ' cur=' + aPageSeq); return; }
		if (!d || !d.ok) throw new Error((d && d.error) || '加载失败');
		console.log('[netease] artist loaded order=' + artistOrder + ' first=' +
			((d.songs && d.songs[0]) ? d.songs[0].name : 'none') + ' n=' + ((d.songs || []).length));
		viewSongs = d.songs || [];
		// startQueue() 是把 viewSrc 当播放来源的，不设的话点歌播放没有 PLAN，
		// 自动续播会断（后端不知道这串歌从哪儿来）。
		viewSrc = { kind: 'artist', sid: aPageId };
		artistName = d.name || aPageName;
		artistTotal = d.count || 0;
		// 热度排序不往下翻：接口可能还会说"还有"，但那是按热度排的全部曲目，
		// 不是用户想看的"代表作"。切到时间排序才有"加载更多"。
		artistMore = (artistOrder === 'time' && d.more) ? 1 : 0;
		const nameEl = $('a-name'), metaEl = $('a-meta');
		nameEl.style.opacity = '0';
		metaEl.style.opacity = '0';
		nameEl.textContent = artistName;
		const bits = [];
		if (artistTotal) bits.push(artistTotal + ' 首');
		if (d.albums) bits.push(d.albums + ' 张专辑');
		if (d.alias) bits.push(d.alias);
		metaEl.textContent = bits.join(' · ');
		requestAnimationFrame(() => {
			nameEl.style.transition = 'opacity .3s ease-out';
			metaEl.style.transition = 'opacity .3s ease-out';
			nameEl.style.opacity = '1';
			metaEl.style.opacity = '1';
		});
		const bgEl = $('a-bg');
		if (d.pic) {
			bgEl.style.backgroundImage = 'url("' + d.pic + '")';
			requestAnimationFrame(() => { bgEl.style.opacity = '1'; });
		}
		$('a-follow').textContent = d.followed ? '已关注' : '关注';
		$('a-follow').classList.toggle('on', !!d.followed);
		$('a-sort').textContent = artistOrder === 'time' ? '时间' : '热度';
		renderArtistList();
		setHint('');
	} catch (e) {
		$('a-meta').textContent = '加载失败';
		setErr('歌手页加载失败：' + (e && e.message ? e.message : e));
	} finally {
		// 只有最后一次请求才收遮罩，否则连点时会提前关掉
		if (seq === aPageSeq && load) load.style.display = 'none';
	}
}

// 歌手页自己的窗口渲染。
// 主页那套（renderWindow）是给 #sp-rows 用的，容器和占位块都不同，
// 这里另起一份：歌手动辄几万首（Beyond 就有四万五），全量渲染直接卡死。
let aWinFrom = -1, aWinTo = -1, aRowH = 0;
const AWIN = 50;      // 上下各预渲染 50 行

function renderArtistWindow(force) {
	const box = $('a-rows');
	const scroller = $('apage');
	if (!box) return;
	const total = viewSongs.length;
	if (!total) { box.innerHTML = '<div id="empty">这里没有歌</div>'; return; }

	// 行高：第一次渲染时量一下，之后固定用（卡片行高一致）。
	// 注意不能用 `height + 6 || 72` 兜底：量不到时得到的是 0，表达式变成 6，
	// 6 像素的行高会让"起始行"算到几万行以外，结果一条都不渲染（列表全空）。
	if (!aRowH) {
		const probe = rowCardFor(viewSongs[0], 0, null);
		box.replaceChildren(probe);
		const h = probe.getBoundingClientRect().height;
		aRowH = h > 40 ? h + 6 : 76;
	}
	const top = Math.max(0, (scroller ? scroller.scrollTop : 0) - (($('a-list').offsetTop || 0)));
	const first = Math.floor(top / aRowH);
	// from 也要夹住：滚到末尾时 first 可能等于 total
	const from = Math.min(Math.max(0, first - AWIN), Math.max(0, total - 1));
	const to = Math.min(total, Math.max(from + 1, first + AWIN * 2));
	if (!force && from === aWinFrom && to === aWinTo) return;
	aWinFrom = from; aWinTo = to;

	const playing = curId ? { id: curId } : null;
	const frag = document.createDocumentFragment();
	for (let i = from; i < to; i++) frag.appendChild(rowCardFor(viewSongs[i], i, playing));
	if (box.replaceChildren) box.replaceChildren(frag);
	else { box.innerHTML = ''; box.appendChild(frag); }
	$('a-top').style.height = (from * aRowH) + 'px';
	$('a-bot').style.height = ((total - to) * aRowH) + 'px';
	// 到底了：既没有下一页，也已经渲染到最后一行
	const end = $('a-end');
	if (end) end.style.display = (artistMore || to < total) ? 'none' : 'block';
}

// 兼容旧调用点
function renderArtistList() {
	aWinFrom = aWinTo = -1;
	renderArtistWindow(true);
}

/* ---------- 歌手页：专辑 tab ---------- */
// 专辑只按发行时间倒序（接口只给这一种），所以这里没有排序切换。
let aTab = 'songs';        // songs | albums
let albumList = [], albumMore = 0, albumTotal = 0, albumSeq = 0, albumLoading = false;

function paintArtistTabs() {
	$('a-tab-songs').classList.toggle('on', aTab === 'songs');
	$('a-tab-albums').classList.toggle('on', aTab === 'albums');

	$('a-list').style.display = aTab === 'songs' ? '' : 'none';

function albumYear(ms) {
	if (!ms) return '';
	return String(new Date(ms).getFullYear());
}

function renderAlbumGrid() {
	const box = $('a-albums');
	if (!box) return;
	box.innerHTML = '';
	if (!albumList.length) {
		box.innerHTML = '<div id="empty" style="grid-column:1/-1">这里没有专辑</div>';
		return;
	}
	albumList.forEach((al) => {
		const card = document.createElement('div');
		card.className = 'aalb';
		const cov = document.createElement('div');
		cov.className = 'cov';
		if (al.pic) cov.style.backgroundImage = 'url("' + al.pic + '")';
		const nm = document.createElement('div');
		nm.className = 'nm'; nm.textContent = al.name;
		const mt = document.createElement('div');
		mt.className = 'mt';
		mt.textContent = [albumYear(al.pub), al.size ? al.size + ' 首' : ''].filter(Boolean).join(' · ');
		card.appendChild(cov); card.appendChild(nm); card.appendChild(mt);
		card.onclick = () => {
			// 歌手页是 z-index:18 的全屏浮层，不先收起来的话，
			// openAlbum 虽然换了主页面内容，用户看到的还是被盖住的歌手页，
			// 表现就是"点专辑没反应"。
			hideAnim($('apage'), 'closing', 150);
			openAlbum(al.id, true);
		};
		box.appendChild(card);
	});
}

async function loadAlbums() {
	if (!aPageId) return;
	const seq = ++albumSeq;
	albumLoading = true;
	const spin = $('a-load');
	if (spin) spin.style.display = 'flex';
	try {
		const d = await e5.api('/albums?id=' + aPageId + '&offset=0&limit=100');
		if (seq !== albumSeq) return;
		if (!d || !d.ok) throw new Error((d && d.error) || '专辑加载失败');
		albumList = d.albums || [];
		albumMore = d.more ? 1 : 0;
		albumTotal = d.total || albumList.length;
		renderAlbumGrid();
		setHint('专辑 ' + (albumTotal || albumList.length) + ' 张');
	} catch (e) {
		setErr('专辑加载失败：' + (e && e.message ? e.message : e));
	} finally {
		if (seq === albumSeq) {
			albumLoading = false;
			const sp = $('a-load');
			if (sp) sp.style.display = 'none';
		}
	}
}

function paintArtistHint() {
	if (!viewSrc || viewSrc.kind !== 'artist') return;
	setHint('歌手 · ' + artistName + ' · 已加载 ' + viewSongs.length +

}

// 歌手动辄上千首，翻到列表底部就再拉一页（后端会把已加载的页记下来，
// 自动续播按同一份顺序算下一首）
// 歌单和歌手页一样：滑到底就再要一页。歌单动辄几千首，一次全展开要十几秒，
// 而且用户根本看不到后面 —— 点开哪个就先给一页。
async function loadMoreList() {
	if (artistLoading || !artistMore) return;
	if (!viewSrc) return;
	const kind = viewSrc.kind;
	if (kind !== 'artist' && kind !== 'playlist' && kind !== 'liked') return;
	artistLoading = true;
	const spin = $('a-load');
	if (spin && $('apage') && !$('apage').hidden) spin.style.display = 'flex';
	try {
		const url = kind === 'artist'
			? '/artist?id=' + viewSrc.sid + '&offset=' + viewSongs.length +
				'&limit=100&order=time'
			: kind === 'liked'
				? '/liked?offset=' + viewSongs.length + '&limit=50'
				: '/playlist?id=' + viewSrc.sid + '&offset=' + viewSongs.length + '&limit=200';
		const d = await e5.api(url);
		if (!d || !d.ok) throw new Error((d && d.error) || '加载失败');
		viewSongs = viewSongs.concat(d.songs || []);
		// liked 也吃 more：后端 plPage 会告诉还有没有下一页
		artistMore = (d.more ? 1 : 0);
		if (d.count) artistTotal = d.count;
		else if (d.total) artistTotal = d.total;
		// 只是变长了：就地更新窗口和底部占位，别整表重建。
		// 歌手页是全量渲染的（就一百首一页），它自己重画；主页才走窗口逻辑。
		const ap = $('apage');
		if (ap && !ap.hidden) renderArtistList();
		else renderWindow(document.documentElement.scrollTop || 0, true);
		if (kind === 'artist') paintArtistHint();
		else setHint(listName + ' · ' + viewSongs.length +
			(artistTotal > viewSongs.length ? ' / ' + artistTotal : '') + ' 首');
	} catch (e) {
		artistMore = 0;
		if (kind === 'artist') paintArtistHint();
	} finally {
		artistLoading = false;
		const spin2 = $('a-load');
		if (spin2) spin2.style.display = 'none';
	}
}

window.addEventListener('scroll', () => {
	if (winRaf) return;
	winRaf = requestAnimationFrame(() => {
		winRaf = 0;
		// 歌手页是全屏浮层，它自己的滚动跟主页列表没关系。
		// 不挡的话，歌手页滚到底会把 loadMoreList 触发起来，
		// 拿歌手数据往主页列表里塞，之后就滑不动了。
		const ap = $('apage');
		if (ap && !ap.hidden) return;
		const doc = document.documentElement;
		const top = doc.scrollTop || window.scrollY || 0;
		renderWindow(top, false);                 // 滚到哪就换哪一段，老的直接丢掉
		if (doc.scrollHeight - top - window.innerHeight < 600) loadMoreList();
	});
}, { passive: true });

// 歌手页是和列表不同的"层级"：这里把分类行换成返回按钮
/* ---------- 子页的收藏按钮 ---------- */
let subTarget = null, subOn = 0;

function paintFavBtn() {
	const b = $('favbtn');
	if (!subTarget) { b.hidden = true; return; }
	b.hidden = false;
	b.textContent = subOn ? '已收藏' : '收藏';
}

// 打开子页时调：先按未收藏显示，再去问后端真实状态
function setSubTarget(kind, id) {
	subTarget = (kind && id) ? { kind: kind, id: id } : null;
	subOn = 0;
	paintFavBtn();
	if (!subTarget) return;
	const want = { kind: kind, id: String(id) };
	e5.api('/substate?kind=' + kind + '&id=' + id).then((d) => {
		if (!subTarget || subTarget.kind !== want.kind || String(subTarget.id) !== want.id) return;
		if (d && d.ok) { subOn = d.on ? 1 : 0; paintFavBtn(); }
	}).catch(() => {});
}

$('favbtn').onclick = async () => {
	if (!subTarget) return;
	const t = subTarget, want = subOn ? 0 : 1;
	$('favbtn').disabled = true;
	try {
		const d = await e5.api('/sub?kind=' + t.kind + '&id=' + t.id + '&on=' + want);
		if (!d || !d.ok) throw new Error((d && d.error) || '操作失败');
		if (subTarget !== t) return;
		subOn = want;
		paintFavBtn();
		setHint(want ? '已收藏' : '已取消收藏');
	} catch (e) {
		setErr(e.message || '操作失败');
	} finally {
		$('favbtn').disabled = false;
	}
};

function paintNav() {

// 等分类页渲染完再把这个入口滚到视野中间（渲染是异步的，只能轮询等它出现）
function revealColl(id) {
	let tries = 0;
	const tick = () => {
		const el = document.querySelector('[data-coll-id="' + id + '"]');
		if (el) {
			const top = el.getBoundingClientRect().top + (window.scrollY || 0);
			window.scrollTo(0, Math.max(0, top - innerHeight * 0.28));
			return;
		}
		if (tries++ < 60) setTimeout(tick, 50);
	};
	tick();
}

function goBackList() {
	// 先退界面、再补数据：头部和歌单行立刻清掉，分类栏立刻回来。
	// 以前是等新列表加载完才 renderSongs()，那期间歌单的封面/名称/简介一直挂着，
	// 看着像是"退出了还在歌单里"。
	viewHead = null;
	const st = backState;
	backState = null;
	viewSongs = [];
	viewSrc = st ? (st.src || null) : null;
	artistMore = 0;
	window.scrollTo(0, 0);
	renderHead();                     // 头部立刻消失（关键：别挂在加载过程里）
	paintNav();                       // 分类栏立刻回来、返回按钮收掉
	loadingAt = 0;                    // 别让 renderSongs 的"最少显示加载中"延迟拖住
	const cb = collBack;
	collBack = null;
	if (cb) {
		// 从歌手页点进来的专辑：回去重新打开那位歌手，并停在专辑 tab
		if (cb.artist) {
			openArtistPage(cb.artist).then(() => {
				aTab = 'albums';
				paintArtistTabs();
				if (albumList.length) renderAlbumGrid();
				else loadAlbums();
			});
			return;
		}
		const b = tabBtns[cb.tab];
		document.querySelectorAll('.tab').forEach((t) => t.classList.toggle('active', t === b));
		if (collSnapshot && collSnapshot.tab === cb.tab) {
			// 有快照：同步重建整页，立刻停在入口处，连加载都不用
			renderCollections(collSnapshot.sections);
			setHint(TABS.find((t) => t.id === cb.tab)?.label || '');
			paintNav();
			revealColl(cb.id);
			return;
		}
		listMsg('加载中…', true);
		selectTab(cb.tab);
		revealColl(cb.id);
		return;
	}
	if (!st) { selectTab('daily'); return; }
	const b = tabBtns[st.tab];
	document.querySelectorAll('.tab').forEach((t) => t.classList.toggle('active', t === b));
	if (st.songs && st.songs.length) {
		// 有快照就直接还原，连"加载中"都不用等
		viewSongs = st.songs.slice();
		renderSongs();
		setHint(st.hint || '');
	} else {
		listMsg('加载中…', true);
		selectTab(st.tab || 'daily');
	}
}

$('back').onclick = goBackList;

// 返回键/手势：先把本页的层级一层层收掉，收无可收才让宿主关应用。
// SDK 的规则是 backFn 没返回 true 就发 {e5:'exit'} —— 这页之前压根没注册 onBack，

});

// 明暗和强调色跟着信息屏走：后端读 /etc/config/e5-infoscreen 的 ui_theme / ui_accent
async function applyTheme() {
	try {
		const d = await e5.api('/theme');
		const light = d && d.theme === 'light';
		document.body.dataset.theme = light ? 'light' : 'dark';
		document.body.dataset.accent = (d && d.accent) || 'teal';
		document.documentElement.style.colorScheme = light ? 'light' : 'dark';
		// 给跳板页 index.html 用：它等不及这个接口，只能同步读缓存来决定底色，
		// 不然浅色模式下进应用会先闪一下深色。
		try {
			localStorage.setItem('netease-theme', light ? 'light' : 'dark');
			localStorage.setItem('netease-accent', (d && d.accent) || 'teal');
		} catch (e) {}
		applyPalette(palRaw);
	} catch (e) { /* 读不到就用默认深色 */ }
}

/* ---------- 登录 ---------- */

let qrKey = null, qrTimer = null;

async function loadMe() {
	try {
		const d = await e5.api('/login/me');
		me = (d && d.logged) ? d : null;
	} catch (e) { me = null; }
	const b = $('account');
	if (me && me.avatar) {
		b.innerHTML = '<img alt="" src="' + me.avatar + '">';
		b.classList.add('pic');
		b.classList.remove('on');
		b.title = (me.nickname || '') + (me.vip ? ' ·VIP' : '');
	} else if (me) {
		b.innerHTML = '';
		b.textContent = (me.nickname || '已登录') + (me.vip ? ' ·VIP' : '');
		b.classList.add('on');
		b.classList.remove('pic');
	} else {
		b.innerHTML = '';
		b.textContent = '登录';
		b.classList.remove('on');
		b.classList.remove('pic');
	}
}

function stopPoll() { if (qrTimer) { clearInterval(qrTimer); qrTimer = null; } }

function closeLogin() {
	stopPoll();
	// 清内容要等淡出播完再清：边淡边清的话，白底二维码会露出来闪一下，
	// 晚上看着像闪光灯。所以塞进 hideAnim 的回调里。
	hideAnim($('login-mask'), 'closing', 150, function () {
		$('qr').classList.remove('pic');
		$('qr').innerHTML = '';
		qrKey = null;
	});
}

function startPoll() {
	stopPoll();
	qrTimer = setInterval(async () => {
		if (!qrKey || $('login-mask').hidden) return;
		try {
			const d = await e5.api('/login/check?key=' + encodeURIComponent(qrKey));
			if (!d || !d.ok) return;
			if (d.code === 803) {
				stopPoll();
				$('qr-status').textContent = '登录成功' + (d.nickname ? '：' + d.nickname : '');
				await loadMe();
				setTimeout(() => { closeLogin(); selectTab('daily'); }, 900);
			} else if (d.code === 802) {
				$('qr-status').textContent = '已扫码，请在手机上点「确认登录」';
			} else if (d.code === 800) {
				stopPoll();
				$('qr-status').textContent = '二维码已过期，关掉重开一次';
			}
		} catch (e) { /* 网络抖动，下一轮再试 */ }
	}, 2000);
}

async function openLogin() {
	showAnim($('login-mask'));
	$('qr').innerHTML = '';
	qrKey = null;
	stopPoll();

	$('login-title').textContent = me ? '账号' : '扫码登录';
	if (me) {
		$('qr').classList.add('pic');
		$('qr').innerHTML = me.avatar
			? '<img alt="" src="' + me.avatar + '">'
			: '';
		$('qr-status').textContent = '已登录：' + (me.nickname || '') + (me.vip ? ' · VIP' : '');
		$('login-action').hidden = false;
		$('login-action').textContent = '退出登录';
		return;
	}
	$('login-action').hidden = true;
	$('qr').classList.remove('pic');
	$('qr-status').textContent = '正在获取二维码…';
	try {
		const d = await e5.api('/login/qr');
		if (!d || !d.ok) throw new Error((d && d.error) || '取二维码失败');
		qrKey = d.key;
		if (d.svg && d.svg.trim()) {
			$('qr').innerHTML = d.svg;
			$('qr-status').textContent = '打开网易云音乐 App，用「扫一扫」';
		} else {
			// 机器上没有 qrencode：退化成给链接，别让人对着一个空框发呆
			$('qr').innerHTML = '';
			$('qr-status').textContent = '这台机器没装 qrencode，请在浏览器打开：' + (d.url || '');
		}
		startPoll();
	} catch (e) {
		$('qr-status').textContent = '获取二维码失败：' + (e && e.message ? e.message : e);
	}
}

$('account').onclick = openLogin;
$('cache-clear').onclick = async () => {
	$('cache-clear').disabled = true;
	$('qr-status').textContent = '正在清理…';
	try {
		const d = await e5.api('/clearcache');
		if (!d || !d.ok) throw new Error((d && d.error) || '清理失败');
		const mb = (d.freed / 1024).toFixed(1);
		$('qr-status').textContent = '已清理 ' + mb + ' MB';
		toast('清理了 ' + mb + ' MB 缓存');
	} catch (e) {
		$('qr-status').textContent = e.message || '清理失败';
	}
	$('cache-clear').disabled = false;
};
$('login-close').onclick = closeLogin;
$('login-action').onclick = async () => {
	if (!me) return;
	try {
		await e5.api('/stop');          // 停止播放：放的是上一个账号的歌
		await e5.api('/logout');
		clearAll();                     // 队列/列表/界面上的数据一起清
		await loadMe();
		$('qr-status').textContent = '已退出登录';
		$('login-action').hidden = true;
		$('qr').classList.remove('pic');
		$('qr').innerHTML = '';
	} catch (e) { $('qr-status').textContent = '退出失败'; }
};

// 退出登录/换号：把界面上属于上一个账号的东西全部清掉，别让它留在列表和队列里
function clearAll() {
	try {
		localStorage.removeItem(QUEUE_KEY);
		localStorage.removeItem(IDX_KEY);
	} catch (e) { /* ignore */ }
	songs = [];
	viewSongs = [];
	index = -1;
	listSrc = null;
	viewSrc = null;
	artistMore = 0;
	artistTotal = 0;
	artistName = '';
	backState = null;
	curId = 0;
	curPid = 0;
	curCover = '';
	curDuration = 0;
	posMs = 0;
	playing = false;
	paused = false;
	likedState = 0;
	likedFor = 0;
	lyricLines = null;
	lyricId = 0;
	me = null;
	$('n-title').textContent = '';
	$('n-sub').textContent = '';
	$('cover').style.backgroundImage = '';
	$('lyr-inner').innerHTML = '';
	$('now').hidden = true;
	$('now').classList.remove('lyrics-mode');
	setToggleIcon(false);
	paintLike();
	renderSongs();
	setHint('已退出登录');
	paintNav();
	renderProgress();
}

/* ---------- 启动 ---------- */

const tabBtns = {};
TABS.forEach((t) => {
	const b = document.createElement('button');
	b.className = 'tab';
	b.textContent = t.label;
	b.onclick = () => loadTab(t, b);
	tabBtns[t.id] = b;
	$('tabs').appendChild(b);
});

function selectTab(id) {
	const b = tabBtns[id];
	if (b) loadTab(TABS.find((x) => x.id === id), b);
}

// 主页左右滑动切分类。手势落在列表上（分类条本身是横向滚动区，不抢它）
function swipeTab(dir) {
	if (viewSrc && viewSrc.kind === 'artist') return;   // 歌手页没有分类可切

	// 收藏页：专辑/歌手/播客 三段当成子页，先在自己内部滑，滑到头才切相邻分类。
	// 往左滑(dir=1)前进：专辑→歌手→播客；往右滑(dir=-1)后退，顺序相反。
	if (curTab === 'fav' && !viewSrc) {
		const kinds = [ 'album', 'artist', 'podcast' ];
		const at = kinds.indexOf(favKind);
		const to = at + dir;
		if (to >= 0 && to < kinds.length) {
			favKind = kinds[to];
			listDir = dir > 0 ? 1 : -1;
			renderFav();
			return;
		}
	}

	const ids = TABS.map((t) => t.id);
	let cur = ids.indexOf(curTab);
	if (cur < 0) cur = 0;
	const next = (cur + dir + ids.length) % ids.length;
	const b = tabBtns[ids[next]];
	if (!b) return;
	// 滑进收藏页：从后面的分类退回来落在末段（播客），从前面进来到首段（专辑）。
	// 点击标签进来不受影响，那边固定从专辑开始。
	if (ids[next] === 'fav') favKind = dir > 0 ? 'album' : 'podcast';
	const list = $('list');
	console.log('[netease] swipe dir=' + dir + ' -> ' + ids[next]);
	// 记下方向：数据回来时 renderSongs 还会再走一次 showListAnim，
	// 不记的话那次永远是"从右进"，往右滑就会看到反方向的进场。
	listDir = dir > 0 ? 1 : -1;
	// 用 Web Animations 直接跑，比加类名再靠重排触发更可靠（类名那套在这台
	// WPE 上时灵时不灵：innerHTML 换掉加载态时动画会被吃掉）
	if (list.animate) {
		list.animate(
			[{ transform: 'translateX(' + (dir > 0 ? 40 : -40) + 'px)', opacity: 0.35 },
			 { transform: 'none', opacity: 1 }],
			{ duration: 240, easing: 'cubic-bezier(.22,.8,.28,1)' }
		);
	} else {
		list.classList.remove('slide-l', 'slide-r');
		void list.offsetWidth;
		list.classList.add(dir > 0 ? 'slide-l' : 'slide-r');
		setTimeout(() => list.classList.remove('slide-l', 'slide-r'), 240);
	}
	loadTab(TABS.find((t) => t.id === ids[next]), b);
}

// 自己接管列表的竖向滚动 + 横向切页。
// 这台 WPE 在 iframe 里做原生滚动时，滚动量会明显大于手指位移（实测 dY=17 → dS=1028），
// 所以干脆 preventDefault 掉原生滚动，用手指位移自己算，保证 1:1。
// 在插件里操作不会重置宿主的 idle 计时器 —— 宿主 60 秒没动静就熄屏，熄屏时会
// closeApp（看起来像"用着用着应用退了 + 锁屏"）。
// 宿主的 resetIdle() 只在收到它自己的按键/触摸时调用，插件这边只能借 keep-awake
// 消息顺手触发它：on:true 会让 resetIdle 跳过（因为 appKeepAwake 为真），
// 紧接着 on:false 又会重新起一个 60 秒的定时器 —— 净效果等于"重置空闲计时"。
function postKa(on) {
	try { parent.postMessage({ e5: 'keep-awake', on: on }, '*'); } catch (e) { /* ignore */ }
}

let kaLast = 0;
function touchAwake() {
	const now = Date.now();
	if (now - kaLast < 500) return;      // 连续触摸别刷太频繁
	kaLast = now;
	postKa(true);
	postKa(false);
}

['touchstart', 'mousedown', 'wheel'].forEach((t) =>
	document.addEventListener(t, touchAwake, { passive: true }));
window.addEventListener('pagehide', () => postKa(false));

// 滚动/切页结束后浏览器还会补一个 click（落在刚划过的那个卡片上），
// 不挡的话滑一下松手就播了。这里在捕获阶段吞掉。
let suppressClickUntil = 0;
document.addEventListener('click', (e) => {
	if (performance.now() < suppressClickUntil) {
		e.preventDefault();
		e.stopPropagation();
	}
}, true);

(function bindGestures() {
	const list = $('list');
	const doc = document.documentElement;
	let x0 = 0, y0 = 0, scroll0 = 0, dx = 0, mode = 0;   // mode: 0 未定 1 滚动 2 切页
	let prevY = 0, prevT = 0, vy = 0, raf = 0;
	let moved = false;              // 这次手势有没有滚动/切页（有的话别当成点击）
	// 手指位移(CSS px) -> 滚动距离的系数。原生滚动在这台机器上约等于 1.25 倍，
	// 1:1 会让内容"跟不上手"，所以按宿主缩放补偿；觉得快/慢就调这一个数。
	const SCROLL_K = 1.25;

	const stopMomentum = () => { if (raf) { cancelAnimationFrame(raf); raf = 0; } };

	list.addEventListener('touchstart', (e) => {
		if (e.touches.length !== 1) return;
		stopMomentum();
		const t = e.touches[0];
		x0 = t.clientX; y0 = t.clientY; dx = 0; mode = 0;
		scroll0 = doc.scrollTop || window.scrollY || 0;
		prevY = t.clientY; prevT = performance.now(); vy = 0;
		moved = false;
	}, { passive: true });

	list.addEventListener('touchmove', (e) => {
		const t = e.touches[0];
		if (!t) return;
		const ndx = t.clientX - x0;
		const ndy = t.clientY - y0;
		dx = ndx;
		if (mode === 0) {
			// 切页要求"几乎纯横向"：横向超过 24px 且至少是纵向的 2.5 倍，
			// 否则一律当成滚动，避免随便一划就换页
			if (Math.abs(ndx) > 24 && Math.abs(ndx) > Math.abs(ndy) * 2.5) { mode = 2; return; }
			if (Math.abs(ndy) > 4) mode = 1; else return;
		}
		if (mode !== 1) return;
		moved = true;
		if (e.cancelable) e.preventDefault();       // 别让浏览器自己滚
		const now = performance.now();
		const dt = now - prevT;
		if (dt > 0) vy = (t.clientY - prevY) / dt;  // px/ms
		prevY = t.clientY; prevT = now;
		window.scrollTo(0, scroll0 - ndy * SCROLL_K);
	}, { passive: false });

	const finish = () => {
		if (mode === 1 && Math.abs(vy) > 0.25) {
			// 松手后的惯性：按最后的速度滑一小段，速度衰减到 0.02 停
			let v = vy * 16 * SCROLL_K;
			const step = () => {
				v *= 0.96;
				if (Math.abs(v) < 0.6) { raf = 0; return; }
				const before = doc.scrollTop;
				window.scrollTo(0, before - v);
				if (doc.scrollTop === before) { raf = 0; return; }   // 到顶/到底
				raf = requestAnimationFrame(step);
			};
			raf = requestAnimationFrame(step);
		}
		mode = 0;
	};

	list.addEventListener('touchend', () => {
		const swipe = Math.abs(dx) >= 90 && mode === 2;
		if (moved || swipe) suppressClickUntil = performance.now() + 450;
		finish();
		if (swipe) swipeTab(dx < 0 ? 1 : -1);
	});
	list.addEventListener('touchcancel', () => { finish(); });
})();

// 播放进程在后端，页面退出重进时它还在放 —— 进来先问一次后端，把界面接回去
async function restoreState() {
	try {
		const d = await e5.api('/status');
		if (!d || !d.ok || !d.active) return false;
		// 队列也一起接回来，否则底栏能显示歌、上一首/下一首却没反应
		const q = loadQueue();
		if (q) {
			songs = q.songs;
			// 只恢复**播放队列**，不把队列当成"正在浏览的列表"。
			// 以前这里会把 viewSongs 换成队列内容，于是每次打开应用都停在
			// 上次那个歌单里 —— 用户想看的通常是首页，队列在播放列表里随时能看。
			listSrc = q.src || null;
			if (listSrc && listSrc.kind === 'artist') { artistMore = 1; artistTotal = 0; artistName = ''; paintSort(); }
			index = songs.findIndex((s) => String(s.id) === String(d.id));
			if (index < 0) index = parseInt(localStorage.getItem(IDX_KEY) || '0', 10) || 0;
			if (index >= songs.length) index = 0;
			// 队列来源能唯一对上分类的，直接用来源纠正（旧数据里 tab 记错成 daily）
			const SKIND = { programs: 'podcasts', liked: 'liked', daily: 'daily' };
			const tabId = (q.src && SKIND[q.src.kind]) || q.tab;
			const b = tabBtns[tabId];
			document.querySelectorAll('.tab').forEach((t) => t.classList.toggle('active', t === b));
			setHint(q.label || '');
			paintNav();
			syncPlan();   // 后端续播要用，重进应用后得重新告诉它一遍
		}
		adoptSong(d);
		startTimer();
		return true;
	} catch (e) { return false; }
}

(async () => {
	await applyTheme();
	// 一致性校正：老版本切走心动模式时没保存队列，会出现
	// "mode=loop 但 queue.src=radio" 的错位，这里纠正过来
	(function () {
		try {
			const q = loadQueue();
			if (!q || !q.src) return;
			if (q.src.kind === 'radio' && playMode !== 'radio') {
				q.src = srcBeforeRadio || null;
				listSrc = q.src;
				localStorage.setItem('netease.queue', JSON.stringify(q));
			} else if (q.src.kind === 'radio') {
				listSrc = q.src;      // 确实是心动模式，把来源接回来
			}
		} catch (e) { /* ignore */ }
	})();
	paintMode();
	await loadMe();
	const resumed = await restoreState();
	// 不管有没有接着上次的播放，进来先给首页（每日推荐）——
	// 播放队列已经恢复了，底栏和播放列表里都在，不该占着浏览区。
	// 没登录时也别急着弹扫码，先给个空列表提示。
	if (me) selectTab('daily');
	else { renderSongs(); setHint('未登录 · 点右上角登录'); }
	// 轮询无条件启动：restoreState 在后端换歌的空档里会拿到 playing:false 直接返回，
	// 那条路径里没启动计时器，页面就永远不知道后来在放什么（封面/标题一直是空的）。
	startTimer();
	pollStatus();   // 立刻对一次账：进应用就能切到正确的"歌曲/单集"模式
	console.log('[netease] ready, e5=' + (window.e5 ? e5.version : 'none') +
		' logged=' + (me ? me.nickname : 'no') + ' resumed=' + resumed +
		' view=' + innerWidth + 'x' + innerHeight +
		' q=' + location.search + ' ver=' + APP_VER);
})();
</script>
